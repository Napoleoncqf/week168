name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: node --test

      - name: Check JavaScript syntax
        run: |
          node --check android/app/src/main/assets/core.js
          node --check android/app/src/main/assets/app.js
          node --check android/app/src/main/assets/text-import.js
          node --check scripts/edition.js
