name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "android/app/src/main/assets/**"
      - "web/**"
      - "scripts/build-web.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: node --test tests/core.test.js tests/app-state.test.js tests/ui-layout.test.js
      - name: Build PWA
        run: node scripts/build-web.mjs dist-web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
      - id: deployment
        uses: actions/deploy-pages@v4
